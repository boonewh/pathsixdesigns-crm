name: CI

# Insurance gate: a PR that fails typecheck or build cannot merge to main
# (main auto-deploys to production via Vercel).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  frontend:
    name: Frontend — typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Lead editing regression tests
        run: npx playwright test tests/lead-options.spec.ts --workers=1
        env:
          VITE_API_BASE_URL: /api
          VITE_SENTRY_DSN: ''
